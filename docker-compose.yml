services:
  postgres:
    image: postgres:16-alpine
    container_name: parkease-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soumithreddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parkease_pass}
      POSTGRES_DB: ${POSTGRES_DB:-parkease}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-soumithreddy} -d $${POSTGRES_DB:-parkease}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parkease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  parkease:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkease
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "5001:5001"

volumes:
  postgres_data:
